
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SwiftletCare{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <h4 class="brand">SwiftletCare</h4>

            <p class="sidebar-caption">QUẢN LÝ TỔNG QUAN</p>

            <nav class="nav flex-column">
                <a class="nav-link" href="/">📊 Tổng quan</a>
                <a class="nav-link" href="/farms">🏠 Nhà yến</a>
                <a class="nav-link" href="/areas">📍 Khu vực</a>
                <a class="nav-link" href="/devices">⚙️ Thiết bị</a>
                <a class="nav-link" href="/sensors">🌡️ Dữ liệu cảm biến</a>
                <a class="nav-link" href="/alerts">🔔 Cảnh báo</a>
            </nav>

            <div class="sidebar-footer">
                Đồ án Hệ quản trị cơ sở dữ liệu
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h5 class="mb-1">
                        {% block page_heading %}Tổng quan{% endblock %}
                    </h5>

                    <small class="text-muted">
                        Hệ thống quản lý và giám sát nhà yến
                    </small>
                </div>

                <span class="status-label">● Hệ thống demo</span>
            </header>

            <section class="page-content">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- API client phải được nạp trước main.js -->
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
