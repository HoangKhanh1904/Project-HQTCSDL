name: Application regression

on:
  pull_request:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sql-flask-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Microsoft ODBC Driver 18
        # Microsoft installation instructions are linked in docs/APPLICATION.md.
        run: |
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Install Python and Chromium dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Provision dedicated SQL Server
        run: python tools/prepare_application_tests.py
      - name: Real SQL Server, Flask, browser and concurrency tests
        run: python -m pytest -q --junitxml=.test-artifacts/results.xml
      - name: Upload test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-regression-evidence
          path: .test-artifacts/
          retention-days: 7
